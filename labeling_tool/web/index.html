<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SkinBouncer Labeling Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo">🛡️ SkinBouncer</span>
    <span class="subtitle">Labeling Tool</span>
  </header>

  <main class="stage">
    <div class="card">
      <div class="progress">
        <span id="progress-text">Loading…</span>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>

      <div class="image-frame">
        <img id="skin-image" alt="current skin" />
        <div id="done-message" class="done-message hidden">
          <div class="done-emoji">🎉</div>
          <div>All images reviewed!</div>
        </div>
      </div>

      <div id="filename" class="filename"></div>

      <div id="meta-row" class="meta-row hidden">
        <span id="meta-recorded" class="meta-badge"></span>
        <span id="meta-reason" class="meta-badge"></span>
        <span id="meta-prob" class="meta-prob"></span>
      </div>

      <div class="actions">
        <button id="btn-bad" class="btn btn-bad" onclick="decide('bad')">
          ✕ Bad <span class="key">B</span>
        </button>
        <button id="btn-skip" class="btn btn-skip" onclick="decide('skip')">
          ↷ Skip <span class="key">Space</span>
        </button>
        <button id="btn-good" class="btn btn-good" onclick="decide('good')">
          ✓ Good <span class="key">G</span>
        </button>
      </div>

      <div id="training-progress" class="training-progress hidden">
        <div id="training-epoch-label" class="training-epoch-label"></div>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-swatch swatch-train"></span>Training</span>
          <span class="legend-item"><span class="legend-swatch swatch-val"></span>Validation (unseen during training)</span>
        </div>
        <canvas id="training-chart" width="392" height="150"></canvas>
      </div>

      <div id="run-comparison" class="run-comparison hidden"></div>

      <div id="confusion-matrix" class="confusion-matrix hidden">
        <div id="confusion-matrix-headline" class="confusion-matrix-headline"></div>
        <div id="test-rates" class="test-rates"></div>
        <div class="confusion-matrix-grid">
          <div class="cm-corner"></div>
          <div class="cm-axis-label">Predicted good</div>
          <div class="cm-axis-label">Predicted bad</div>
          <div class="cm-axis-label">Actually good</div>
          <div id="cm-tn" class="confusion-matrix-cell correct"></div>
          <div id="cm-fp" class="confusion-matrix-cell incorrect"></div>
          <div class="cm-axis-label">Actually bad</div>
          <div id="cm-fn" class="confusion-matrix-cell incorrect"></div>
          <div id="cm-tp" class="confusion-matrix-cell correct"></div>
        </div>
        <div class="confusion-matrix-caption">Measured on test images the model never trained or tuned on.</div>
        <div id="curation-note" class="curation-note hidden"></div>
      </div>

      <button id="btn-retrain" class="btn btn-retrain hidden" onclick="retrain()">🔄 Retrain</button>
      <button id="btn-export" class="btn btn-export hidden" onclick="exportDetector()">📦 Export detector</button>
      <div id="export-result" class="export-result hidden"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>

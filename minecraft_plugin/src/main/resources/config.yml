# Where the SkinBouncer API is reachable from the server process. When both run under
# 06_Deployment/docker-compose.demo.yml they share a network and the API is just "api".
api-url: http://api:8000/check/player/

# Covers the whole request. The API resolves the player through Mojang and downloads the
# skin before it runs inference, so this needs headroom well beyond local latency.
timeout-seconds: 30

# Log a line for every join, not only flagged ones. Useful while setting the system up,
# noisy on a busy server.
log-clean-joins: false
